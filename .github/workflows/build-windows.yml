# Windows-збірка GUI (PyInstaller onedir: ukr-layout.exe + ukr-stats.exe) -> zip-артефакт.
# Запуск: вручну з будь-якої гілки (Actions -> Build Windows -> Run workflow,
# або `gh workflow run build-windows.yml --ref ГІЛКА`) чи тегом v* —
# тоді zip ще й прикріплюється до GitHub Release.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write      # для релізу за тегом
  id-token: write      # підпис походження збірки (attestation, Sigstore)
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Залежності
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6 numba==0.68.1 PyYAML==6.0.3 Pillow==12.3.0 pyserial==3.5 pytest==9.1.1 pyinstaller==6.22.3

      # Tk на Windows-раннерах зрідка не стартує («Can't find a usable init.tcl»,
      # 2026-11-15) — впалі тести проганяються ще раз.
      - name: Тести
        shell: pwsh
        timeout-minutes: 10   # модальне вікно в тесті не повинно вішати збірку на добу
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { python -m pytest -q --lf }

      - name: Збірка
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/ukr_layout.spec

      - name: Перевірка exe (вікно відкривається і закривається)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ukr-layout\ukr-layout.exe -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "exe завершився з кодом $($p.ExitCode)"; exit 1 }

      - name: Перевірка exe статистики (воркери рахують, вікно відкривається)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ukr-layout\ukr-stats.exe -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "ukr-stats.exe завершився з кодом $($p.ExitCode)"; exit 1 }

      # ярлики без інсталятора: юзер запускає .bat поруч з exe (packaging/windows)
      - name: Скрипти ярликів
        shell: pwsh
        run: |
          Copy-Item packaging\windows\shortcuts.ps1 dist\ukr-layout\
          Copy-Item packaging\windows\create-shortcuts.bat "dist\ukr-layout\Створити ярлики.bat"
          Copy-Item packaging\windows\remove-shortcuts.bat "dist\ukr-layout\Видалити ярлики.bat"

      - name: Перевірка ярликів (створити -> є .lnk -> видалити)
        shell: pwsh
        run: |
          # копія в кириличну теку з пробілом — як після розпакування в «Завантаження»
          $copy = Join-Path $env:RUNNER_TEMP 'Завантаження тест\ukr-layout'
          New-Item -ItemType Directory -Force -Path (Split-Path $copy) | Out-Null
          Copy-Item -Recurse dist\ukr-layout $copy
          powershell -NoProfile -ExecutionPolicy Bypass -File "$copy\shortcuts.ps1"
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'ukr-layout'
          $n = (Get-ChildItem -LiteralPath $lnk -Filter *.lnk).Count
          if ($n -ne 2) { Write-Error "у «Пуск» $n ярликів замість 2"; exit 1 }
          $ns = (New-Object -ComObject Shell.Application).NameSpace($lnk)   # Unicode, на відміну від WScript.Shell
          foreach ($f in Get-ChildItem -LiteralPath $lnk -Filter *.lnk) {
            $t = $ns.ParseName($f.Name).GetLink.Path
            "$($f.Name) -> $t"
            if (-not (Test-Path -LiteralPath $t) -or -not $t.StartsWith($copy)) { Write-Error "ярлик веде не туди: $t"; exit 1 }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$copy\shortcuts.ps1" -Remove
          if (Test-Path -LiteralPath $lnk) { Write-Error "ярлики не прибрано"; exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\ukr-layout -DestinationPath ukr-layout-windows.zip

      # хеші: архів + exe всередині (тестер перевіряє Get-FileHash)
      - name: SHA256SUMS
        shell: pwsh
        run: |
          $files = @('ukr-layout-windows.zip', 'dist\ukr-layout\ukr-layout.exe', 'dist\ukr-layout\ukr-stats.exe')
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$h  $((Split-Path $f -Leaf))"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          $zip = (Get-FileHash -Algorithm SHA256 ukr-layout-windows.zip).Hash.ToLower()
          "ZIP_SHA256=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # підпис походження: `gh attestation verify ФАЙЛ -R ВЛАСНИК/РЕПО`
      - name: Підпис походження (attestation)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ukr-layout-windows.zip
            dist/ukr-layout/ukr-layout.exe
            dist/ukr-layout/ukr-stats.exe

      - uses: actions/upload-artifact@v5
        with:
          name: ukr-layout-windows
          path: |
            ukr-layout-windows.zip
            SHA256SUMS.txt

      - name: Текст релізу
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $t = Get-Content -Raw -Encoding utf8 packaging\release_notes.md
          $t = $t.Replace('{SHA256}', "$env:ZIP_SHA256  ukr-layout-windows.zip")
          $t = $t.Replace('{RUN_URL}', $run).Replace('{REPO}', '${{ github.repository }}')
          Set-Content -Encoding utf8 -Path release_body.md -Value $t

      - name: Реліз (лише для тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — тестова версія
          body_path: release_body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ukr-layout-windows.zip
            SHA256SUMS.txt
