# Windows-збірка GUI (PyInstaller onedir: ukr-layout.exe + ukr-stats.exe) -> zip-артефакт.
# Запуск: вручну з будь-якої гілки (Actions -> Build Windows -> Run workflow,
# або `gh workflow run build-windows.yml --ref ГІЛКА`) чи тегом v* —
# тоді zip ще й прикріплюється до GitHub Release.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # для релізу за тегом

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Залежності
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6 numba==0.68.1 PyYAML==6.0.3 Pillow==12.3.0 pyserial==3.5 pytest==9.1.1 pyinstaller==6.22.3

      # Tk на Windows-раннерах зрідка не стартує («Can't find a usable init.tcl»,
      # 2026-11-15) — впалі тести проганяються ще раз.
      - name: Тести
        shell: pwsh
        timeout-minutes: 10   # модальне вікно в тесті не повинно вішати збірку на добу
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { python -m pytest -q --lf }

      - name: Збірка
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/ukr_layout.spec

      - name: Перевірка exe (вікно відкривається і закривається)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ukr-layout\ukr-layout.exe -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "exe завершився з кодом $($p.ExitCode)"; exit 1 }

      - name: Перевірка exe статистики (воркери рахують, вікно відкривається)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ukr-layout\ukr-stats.exe -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "ukr-stats.exe завершився з кодом $($p.ExitCode)"; exit 1 }

      # ярлики без інсталятора: юзер запускає .bat поруч з exe (packaging/windows)
      - name: Скрипти ярликів
        shell: pwsh
        run: |
          Copy-Item packaging\windows\shortcuts.ps1 dist\ukr-layout\
          Copy-Item packaging\windows\create-shortcuts.bat "dist\ukr-layout\Створити ярлики.bat"
          Copy-Item packaging\windows\remove-shortcuts.bat "dist\ukr-layout\Видалити ярлики.bat"
          $ps = [System.Management.Automation.Language.Parser]::ParseFile("$PWD\dist\ukr-layout\shortcuts.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs; exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\ukr-layout -DestinationPath ukr-layout-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ukr-layout-windows
          path: ukr-layout-windows.zip

      - name: Реліз (лише для тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ukr-layout-windows.zip
