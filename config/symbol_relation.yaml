# ukr_alphabet.yaml — довідник символів!
# В даному файлі крнфігурацій знаходяться українсьуідітери + символи через Shift/AltGr.
# Фізичне розміщення по клавішах — окремий конфіг.
# йцукенгшщзхїфівапролджєячсмитьбю. ,
keys:
  - id: a
    base: "а"
    shift: "А"

  - id: i_ukr
    base: "і"
    shift: "І"

  - id: yi
    base: "ї"
    shift: "Ї"

  - id: ie
    base: "є"
    shift: "Є"

  - id: apostrophe
    base: "'"
    shift: null          # апострофу нема куди підняти шифтом

  - id: comma
    base: ","
    shift: "?"           # умовний приклад: рівень2 коми — знак питання

  - id: period
    base: "."
    level3: "…"          # умовний приклад символу через AltGr