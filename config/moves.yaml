version: 1

# Every detected event adds `count * weight` to the score. A lower total is
# better; negative weights are bonuses.
base_effort:
  row_multiplier:
    top: 1.10
    home_row: 0.50
    bottom: 1.20
    other: 1.00
  column_multiplier:
    home_col: 0.90
    col: 9.00
    other: 1.00
  finger_multiplier:
    pinky: 1.40
    ring: 1.15
    middle: 1.05
    index: 1.20
    thumb: 1.00

same_finger:
  double_tap: 1.10
  adjacent_row: 1.70
  skip_row: 3.00

finger_alternation:
  brother_finger: 1.10  # сусідні пальці (index-middle, middle-ring)
  nextdoor_finger: 1.00  # через один (index-ring, middle-pinky)
  foreign_finger: 1.30   # index-pinky
  ring_pinky_crash: 1.50  # this is really awkward moves
  thumb_mult: 0.60  # якщо один з пальців — thumb, окремий множник

shape_multiplier:
  vertical: 1.60
  diagonal: 2.00
  horizontal: 1.30

roll:
  inward: 0.01
  outward: 0.10
  awkward: 6.00

hand:
  alternation: 1.00
  strict_alternation: 3.00
  left_mult: 1.05
  right_mult: 1.01

skip_bigram:
  same_finger: 2.00
  same_hand: 0.50
