version: 1

# Every detected event adds `count * weight` to the score. A lower total is
# better; negative weights are bonuses.
base_effort:
  row_multiplier:
    top: 1.40
    home_row: 1.00
    bottom: 1.20
    other: 1.00
  column_multiplier:
    home_col: 1.00
    col: 5.00
    other: 4.00
  finger_multiplier:
    pinky: 1.30
    ring: 1.20
    middle: 1.05
    index: 1.10
    thumb: 1.00

same_finger:
  double_tap: 1.30
  adjacent_row: 2.00
  skip_row: 4.00

shape_multiplier:
  vertical: 1.10
  diagonal: 1.60
  horizontal: 1.40

roll:
  inward: 0.90
  outward: 1.30
  awkward: 8.00

hand:
  alternation: 1.00
  strict_alternation: 3.00
  left_mult: 1.2
  right_mult: 1.1

skip_bigram:
  same_finger: 1.1
  same_hand: 0.10
