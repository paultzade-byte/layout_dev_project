version: 1

# Every detected event adds `count * weight` to the score. A lower total is
# better; negative weights are bonuses.
base_effort:
  row_multiplier:
    top: 1.50
    home_row: 0.50
    bottom: 1.55
    other: 1.00
  # лише в base_effort; за прапорцем home_col клавіші в geometry.json
  column_multiplier:
    home_col: 1.00  # домашня колонка пальця
    col: 1.50       # дотична колонка (бічна вказівного, зовнішня мізинця)
    other: 1.00     # клавіші поза основною сіткою (thumb)
  finger_multiplier:
    pinky: 1.40
    ring: 1.15
    middle: 1.05
    index: 1.20
    thumb: 1.00

# Той самий палець на двох послідовних клавішах.
# same_key/lateral/vertical/diagonal_* множаться на finger_multiplier,
# skip_row — абсолютна шкала (див. нижче).
same_finger:
  same_key: 1.10       # та сама клавіша двічі ("нн") — палець не рухається
  lateral: 1.40        # горизонталь: той самий ряд, сусідня колонка — найлегший SFB
  diagonal_down: 2.00  # зміна колонки + ряд вниз
  diagonal_up: 2.40    # зміна колонки + ряд вгору — найважча діагональ
  vertical: 2.70       # той самий стовпчик, сусідній ряд
  # перескок нижній <-> верхній через домашній ряд (SFS)
  skip_row:
    max: 6.00          # максимум: мізинець з дотичної колонки на домашню
    ratio:             # решта перескоків = ratio * max
      pinky: 0.90
      ring: 0.90
      middle: 0.90
      index: 0.90

# Біграма однією рукою різними пальцями (перекат). Штраф лише за незручні
# пари — природні перекати не повинні програвати чергуванню рук.
# Напрямок (всередину/назовні) тут не враховується: для сусідніх пальців
# обидва зручні.
finger_alternation:
  brother_finger: 0.00    # сусідні (index-middle, middle-ring) — зручно в обидва боки
  nextdoor_finger: 0.20   # через один (index-ring, middle-pinky) — трохи гірше
  foreign_finger: 0.30    # index-pinky — широкий розмах
  ring_pinky_crash: 0.50  # ring-pinky — найнезручніше, але не критично
  thumb_mult: 0.00        # пара з великим пальцем

roll:
  inward: 0.01
  outward: 0.10
  awkward: 6.00

# Форма перекату по рядах для трійки однією рукою (різні сусідні пальці).
# Додається до roll.* вище. Від'ємне значення — бонус.
roll_rows:
  natural_arc: -0.50  # home + top лише середнім/безіменним (мізинець-h, середній-t, вказівний-h)
  bottom_step: 0.00   # home + bottom без верхнього (дві на home, третя внизу) — нормально
  row_skip: 0.80      # і верхній, і нижній ряд в одному перекаті — трохи гірше
  drop_jump: 2.00     # проміжна провалюється вниз, наступна стрибає вгору — найгірше

hand:
  left_mult: 1.05
  right_mult: 1.01

# Баланс альтернації рук: слово ділиться на серії натискань однією рукою,
# штраф — за кожну серію, помножений на частоту слова (config/word_stats.json).
# Добра альтернація — серії по 2-3 (2-2, 3-3, 2-3 ...).
hand_runs:
  single: 3.00         # серія з 1 всередині слова (пінбол L-R-L); противага
                       # штрафам за набір однією рукою, як колишній strict_alternation
  balanced: 0.00       # серії з 2-3 натискань — ідеал
  overload: 1.00       # серія з 4 натискань однією рукою
  overload_step: 1.00  # + за кожне натискання понад 4 (5 -> 2.0, 6 -> 3.0 ...)

skip_bigram:
  same_finger: 2.00
  same_hand: 0.50
